<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; manifest-src 'self'; worker-src 'self'; media-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="guard.js"></script>
<script src="version.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panadería</title>
<meta name="description" content="Panadería: registro de pesaje, entregas y ventas.">
<meta name="theme-color" content="#FAF5EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1410" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panadería">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="icon" href="icons/icon.svg?v=1" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=1">
<link rel="preload" href="fonts/Barlow-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/BarlowCondensed-Bold.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/componentes.css">
</head>
<body>
<noscript><p class="noscript">Esta aplicación necesita JavaScript activado.</p></noscript>

<!-- Ingreso (lo dibuja js/pantallas/ingreso.js) -->
<div id="gate" class="wrap gate" hidden></div>

<!-- La aplicación (solo con sesión iniciada) -->
<div id="appRoot" hidden>
  <div class="app wrap">
    <header class="top">
      <div class="brand"><span class="mk" id="mark" aria-hidden="true"></span><span class="brand-name">Panadería</span></div>
      <button class="icon-btn" id="gear" data-act="ir" data-tab="mas" aria-label="Más opciones y ajustes"></button>
    </header>
    <div id="netBar" class="netbar" role="status" hidden></div>
    <div id="updBar" class="updbar" role="status" aria-live="polite" hidden></div>
    <div id="banner"></div>
    <main id="view"></main>
  </div>
  <div id="bar"><nav id="nav" aria-label="Secciones"></nav></div>
</div>
<dialog id="dlg" aria-label="Panel"></dialog>
<div id="toast" popover="manual" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
