# Pruebas en cada cambio. Seguridad (PLAN §9): permisos mínimos, acciones fijadas por hash, sin secretos.
name: Pruebas
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
      - name: Instalar dependencias de prueba
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx playwright install --with-deps chromium
      - name: Pruebas
        run: node tools/run-tests.js
      - name: Reglas de Firestore (emulador)
        run: |
          npm install --no-save --no-audit --no-fund firebase@12.15.0 @firebase/rules-unit-testing@5.0.0
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-panaderia "node tests/rules-emulator.js"
